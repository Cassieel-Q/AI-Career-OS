<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI Career OS · 导入当前岗位</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">AI Career OS</div>
      <div class="sub" id="page-host">当前页面：—</div>
    </header>

    <section class="block">
      <div class="row">
        <button id="btn-read" class="primary">读取当前岗位</button>
        <button id="btn-open-app">打开 AI Career OS</button>
      </div>
      <p class="hint">
        只在<b>你点击之后</b>读取当前页面上已经显示的岗位内容；不读取 Cookie、密码、验证码和聊天记录。
      </p>
    </section>

    <section class="block" id="pair-block">
      <h2>本机配对</h2>
      <p class="hint" id="pair-state">检查中…</p>
      <div class="row" id="pair-input-row">
        <input id="pair-code" inputmode="numeric" maxlength="6" placeholder="6 位配对码" />
        <button id="btn-pair">配对</button>
      </div>
      <p class="hint">
        配对码在 AI Career OS 的「设置 → 浏览器扩展」里生成，5 分钟内有效。
      </p>
    </section>

    <section class="block hidden" id="result-block">
      <h2>读取结果（可修改后再导入）</h2>
      <p class="warn hidden" id="read-warning"></p>
      <div id="fields"></div>
      <label class="field">
        <span>完整 JD</span>
        <textarea id="f-jd" rows="6"></textarea>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="f-update" />
        <span>岗位已存在但内容有变化时更新（不覆盖你的备注与投递状态）</span>
      </label>
      <div class="row">
        <button id="btn-import" class="primary">预览并导入 AI Career OS</button>
      </div>
      <p class="msg" id="import-msg"></p>
    </section>

    <section class="block">
      <details>
        <summary>设置</summary>
        <label class="field">
          <span>本机 API 地址</span>
          <input id="f-apibase" placeholder="http://127.0.0.1:8100" />
        </label>
        <div class="row">
          <button id="btn-save-settings">保存设置</button>
          <button id="btn-clear-token" class="danger">清除配对</button>
        </div>
        <p class="msg" id="settings-msg"></p>
      </details>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
